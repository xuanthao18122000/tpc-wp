services:
  wordpress:
    image: wordpress:7.0-php8.3-apache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: tp-wp
    restart: unless-stopped
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: ${WP_DEBUG}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_MEMORY_LIMIT', '256M');
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads

  wpcli:
    image: wordpress:cli-php8.3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: tp-cli
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      # wp db export/import gọi mariadb-dump; MySQL 8.0 local dùng cert tự ký
      # nên phải tắt xác thực TLS cho các lệnh này.
      WP_CLI_CONFIG_PATH: /etc/wp-cli.yml
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes:/var/www/html/wp-content/themes
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./scripts:/scripts
      - ./config/mysql-client.cnf:/etc/mysql/my.cnf:ro
      - ./config/wp-cli.yml:/etc/wp-cli.yml:ro
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  wp_core:
